name: ENSEMBITS one-off literature delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ensembits-one-off-20261016
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Send curated topic report exactly once
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: node .github/scripts/send-ensembits-20261016.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensembits-literature-20261016
          path: |
            docs/research/ensembits-2026-10-16.*
            outputs/ensembits-delivery.json
          if-no-files-found: error
