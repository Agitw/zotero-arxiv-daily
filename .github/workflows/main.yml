name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Shanghai daily.
    - cron: '0 1 * * *'

permissions:
  contents: read
  issues: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('config/base.yaml', 'config/custom.yaml', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Restore Zotero embedding cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/zotero-corpus-embeddings.json
          key: zotero-corpus-embeddings-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            zotero-corpus-embeddings-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore recommendation history
        uses: actions/cache/restore@v4
        with:
          path: .cache/recommendation-history.json
          key: recommendation-history-main-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            recommendation-history-main-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
        run: |
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save recommendation history
        if: success() && hashFiles('.cache/recommendation-history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/recommendation-history.json
          key: recommendation-history-main-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload recommendation funnel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-funnel-${{ github.run_id }}
          path: outputs/recommendation-funnel.json
          if-no-files-found: warn
