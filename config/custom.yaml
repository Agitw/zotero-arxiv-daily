zotero:
  source: ${oc.env:ZOTERO_SOURCE,auto}
  user_id: ${oc.env:ZOTERO_ID,''}
  api_key: ${oc.env:ZOTERO_KEY,''}
  local_sqlite_path: ${oc.env:ZOTERO_SQLITE_PATH,''}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]
  ignore_path:
    - "tmp"
    - "tmp/**"
    - "tools"
    - "tools/**"
    - "AI tutorial"
    - "AI tutorial/**"

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_BASE_URL,${oc.env:OPENAI_API_BASE,''}}
  generation_kwargs:
    max_tokens: 768
    model: deepseek-v4-flash
  affiliation_generation_kwargs:
    max_tokens: 128
  language: Chinese

source:
  arxiv:
    category: ["q-bio.BM","q-bio.QM","cs.LG"]
    include_cross_list: false
  biorxiv:
    category: ["bioinformatics","biophysics","biochemistry","bioengineering"]
  openalex:
    # Fourteen calendar dates including today; Chinese holidays can extend the window.
    # Sent papers are removed by recommendation history on subsequent runs.
    days: 14
    per_page: 200
    max_results: 3000
    mailto: null
    issns:
      # Broad, internationally prominent journals
      - "0028-0836" # Nature
      - "0036-8075" # Science
      - "0092-8674" # Cell
      - "1755-4330" # Nature Chemistry
      - "0002-7863" # Journal of the American Chemical Society
      - "1433-7851" # Angewandte Chemie International Edition
      - "1552-4450" # Nature Chemical Biology
      - "1545-9985" # Nature Structural & Molecular Biology
      - "1097-2765" # Molecular Cell
      - "0027-8424" # Proceedings of the National Academy of Sciences
      - "2041-1723" # Nature Communications
      - "2375-2548" # Science Advances
      # Major review journals (OpenAlex article and review types)
      - "0009-2665" # Chemical Reviews
      - "0306-0012" # Chemical Society Reviews
      - "0001-4842" # Accounts of Chemical Research
      - "1474-1776" # Nature Reviews Drug Discovery
      - "1471-0072" # Nature Reviews Molecular Cell Biology
      # Computational chemistry / cheminformatics
      - "1549-9618" # Journal of Chemical Theory and Computation
      - "1549-9596" # Journal of Chemical Information and Modeling
      - "1758-2946" # Journal of Cheminformatics
      - "0021-9606" # Journal of Chemical Physics
      - "2041-6539" # Chemical Science
      - "1759-0876" # WIREs Computational Molecular Science
      - "1089-5639" # The Journal of Physical Chemistry A
      - "1520-5207" # The Journal of Physical Chemistry B
      - "2374-7943" # ACS Central Science
      - "2635-098X" # Digital Discovery
      # Computational biology / bioinformatics / structure
      - "1553-7358" # PLOS Computational Biology
      - "1467-5463" # Briefings in Bioinformatics
      - "1474-760X" # Genome Biology
      - "0305-1048" # Nucleic Acids Research
      - "1744-4292" # Molecular Systems Biology
      - "0022-2836" # Journal of Molecular Biology
      - "0969-2126" # Structure
      - "2050-084X" # eLife
      - "1548-7091" # Nature Methods
      - "1087-0156" # Nature Biotechnology
      - "1471-2164" # BMC Genomics
      - "2047-217X" # GigaScience
      - "1088-9051" # Genome Research
      - "1532-0464" # Journal of Biomedical Informatics
      - "2052-4463" # Scientific Data
      - "2662-8457" # Nature Computational Science
      - "2056-7189" # npj Systems Biology and Applications
      - "2666-3899" # Patterns
      - "2405-4712" # Cell Systems
      - "2666-979X" # Cell Genomics
      # AI methods
      - "2522-5839" # Nature Machine Intelligence

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv','biorxiv','openalex']
  rerank_candidate_num: null
  max_paper_num: 30
  include_all_deepseek_score_at_least: 8.0
  recommendation_history_path: .cache/recommendation-history.json
  recommendation_history_days: 60
  recommendation_funnel_path: outputs/recommendation-funnel.json
  feedback_path: ${oc.env:FEEDBACK_PATH,config/feedback.json}
  feedback_endpoint: ${oc.env:FEEDBACK_ENDPOINT,''}
  feedback_secret: ${oc.env:FEEDBACK_SECRET,''}
  feedback_github_repository: ${oc.env:GITHUB_REPOSITORY,''}
  feedback_github_token: ${oc.env:GITHUB_TOKEN,''}
  reranker: hybrid_llm

reranker:
  # Final score = max(0, blended relevance + venue adjustment + feedback adjustment).
  venue_bonus_min_deepseek_score: 6.0
  # Signed adjustments: positive values require relevant DeepSeek scoring;
  # negative values lower peripheral venues even on embedding fallback.
  venue_bonuses:
    "0028-0836": 0.80 # Nature
    "0036-8075": 0.80 # Science
    "0092-8674": 0.80 # Cell
    "1755-4330": 0.80 # Nature Chemistry
    "0002-7863": 0.80 # Journal of the American Chemical Society
    "1433-7851": 0.80 # Angewandte Chemie International Edition
    "1552-4450": 0.80 # Nature Chemical Biology
    "1545-9985": 0.80 # Nature Structural & Molecular Biology
    "1097-2765": 0.80 # Molecular Cell
    "0027-8424": 0.60 # PNAS
    "2041-1723": 0.60 # Nature Communications
    "2375-2548": 0.60 # Science Advances
    "0009-2665": 0.60 # Chemical Reviews
    "0306-0012": 0.60 # Chemical Society Reviews
    "0001-4842": 0.45 # Accounts of Chemical Research
    "1474-1776": 0.60 # Nature Reviews Drug Discovery
    "1471-0072": 0.60 # Nature Reviews Molecular Cell Biology
    "2522-5839": 0.80 # Nature Machine Intelligence
    "1548-7091": 0.80 # Nature Methods
    "1087-0156": 0.80 # Nature Biotechnology
    "2662-8457": 0.60 # Nature Computational Science
    "2374-7943": 0.60 # ACS Central Science
    "2041-6539": 0.45 # Chemical Science
    "1474-760X": 0.45 # Genome Biology
    "0305-1048": 0.45 # Nucleic Acids Research
    "1549-9618": 0.30 # Journal of Chemical Theory and Computation
    "1549-9596": 0.30 # Journal of Chemical Information and Modeling
    "0021-9606": 0.30 # Journal of Chemical Physics
    "1553-7358": 0.30 # PLOS Computational Biology
    "1467-5463": 0.30 # Briefings in Bioinformatics
    "1088-9051": 0.30 # Genome Research
    "2050-084X": 0.30 # eLife
    "1744-4292": 0.30 # Molecular Systems Biology
    # Peripheral journals remain discoverable when the paper itself is relevant.
    "1471-2164": -0.30 # BMC Genomics
    "1532-0464": -0.30 # Journal of Biomedical Informatics
    "2047-217X": -0.30 # GigaScience
    "2056-7189": -0.30 # npj Systems Biology and Applications
    "1089-5639": -0.30 # The Journal of Physical Chemistry A
    "1520-5207": -0.30 # The Journal of Physical Chemistry B
  hybrid_llm:
    model: deepseek-v4-flash
    embedding_model: BAAI/bge-small-en-v1.5
    cache_path: .cache/zotero-corpus-embeddings.json
    cache_build_batch_size: 128
    llm_candidate_num: 100
    llm_global_candidate_num: 70
    llm_high_impact_candidate_num: 30
    evidence_per_candidate: 5
    candidate_batch_size: 10
    max_abstract_chars: 700
    max_evidence_abstract_chars: 500
    deepseek_score_weight: 0.7
    generation_kwargs:
      max_tokens: 128
    encode_kwargs:
      normalize_embeddings: true
